<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="light dark" name="color-scheme">
    <title th:text="${productName} + ' | ' + ${serviceName}">Naviqore | Public Transit Service</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="apple-touch-icon" th:href="@{/logo.png}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div class="bg-gradient-bar"></div>
<div class="blob blob-top"></div>
<div class="blob blob-bottom"></div>

<div class="viewport-container">
    <main>
        <div class="card">
            <header class="header">
                <div class="logo-container">
                    <img alt="" height="56" th:src="@{/logo.png}" width="56">
                </div>

                <h1 class="brand-title">
                    <span class="product-name" th:text="${productName}">Naviqore</span>
                    <span class="service-name" th:text="${serviceName}">Public Transit Service</span>
                </h1>
                <p class="description" th:text="${description}"></p>
            </header>

            <dl class="stats-bar">
                <div class="stat-item">
                    <dt class="stat-label">
                        <span aria-hidden="true" class="icon icon-tag stat-icon"></span>
                        <span>Version</span>
                    </dt>
                    <dd class="stat-value" th:text="${version}">5.0.0</dd>
                </div>

                <div class="stat-item" th:if="${health != null}">
                    <dt class="stat-label">
                        <span aria-hidden="true" class="icon icon-activity stat-icon"></span>
                        <span>Status</span>
                    </dt>
                    <dd class="stat-value" th:classappend="|tone-${health.tone}|">
                        <span aria-hidden="true" class="status-dot"></span>
                        <span th:text="${health.label}">Up</span>
                    </dd>
                </div>

                <div class="stat-item">
                    <dt class="stat-label">
                        <span aria-hidden="true" class="icon icon-calendar stat-icon"></span>
                        <span>Schedule</span>
                    </dt>
                    <dd class="stat-value">
                        <time th:datetime="${schedule.startDate}" th:text="${schedule.startDate}">2026-01-01</time>
                        &ndash;
                        <time th:datetime="${schedule.endDate}" th:text="${schedule.endDate}">2026-12-31</time>
                    </dd>
                    <dd class="stat-flag" th:unless="${schedule.validToday}">
                        <span aria-hidden="true" class="status-dot"></span>
                        <span>Not valid today</span>
                    </dd>
                </div>
            </dl>

            <nav class="nav-section" th:unless="${links.empty}">
                <div class="grid">
                    <a class="nav-card" th:href="@{${links.apiConsole}}" th:if="${links.apiConsole != null}">
                        <span class="nav-content">
                            <span class="nav-icon-bg"><span aria-hidden="true" class="icon icon-terminal"></span></span>
                            <span class="nav-label">API Console</span>
                        </span>
                        <span aria-hidden="true" class="icon icon-chevron chevron"></span>
                    </a>
                    <a class="nav-card" th:href="@{${links.openApi}}" th:if="${links.openApi != null}">
                        <span class="nav-content">
                            <span class="nav-icon-bg"><span aria-hidden="true" class="icon icon-file"></span></span>
                            <span class="nav-label">OpenAPI</span>
                        </span>
                        <span aria-hidden="true" class="icon icon-chevron chevron"></span>
                    </a>
                    <a class="nav-card" th:href="@{${links.health}}" th:if="${links.health != null}">
                        <span class="nav-content">
                            <span class="nav-icon-bg"><span aria-hidden="true" class="icon icon-heart"></span></span>
                            <span class="nav-label">Health</span>
                        </span>
                        <span aria-hidden="true" class="icon icon-chevron chevron"></span>
                    </a>
                    <a class="nav-card" th:href="@{${links.metrics}}" th:if="${links.metrics != null}">
                        <span class="nav-content">
                            <span class="nav-icon-bg"><span aria-hidden="true" class="icon icon-chart"></span></span>
                            <span class="nav-label">Metrics</span>
                        </span>
                        <span aria-hidden="true" class="icon icon-chevron chevron"></span>
                    </a>
                </div>
            </nav>

            <footer>
                <div>&copy; <span th:text="${#calendars.format(#calendars.createNow(), 'yyyy')}"></span> Naviqore</div>
                <div class="footer-links">
                    <a href="https://naviqore.org" rel="noopener noreferrer" target="_blank">Website</a>
                    <a href="https://github.com/naviqore/public-transit-service" rel="noopener noreferrer"
                       target="_blank">GitHub</a>
                </div>
            </footer>
        </div>
    </main>
</div>

</body>
</html>
