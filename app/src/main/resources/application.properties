# The configuration of the app. Each property is set by the environment variable named after it in upper case, with '.'
# and '-' replaced by '_': for example, 'naviqore.gtfs.static.uri' by NAVIQORE_GTFS_STATIC_URI and 'logging.level.root'
# by LOGGING_LEVEL_ROOT. An environment variable takes precedence over this file. The values below are the defaults of
# the app; 'naviqore.gtfs.static.uri' has none and is set to a sample feed for development.
# ==============================================
# GTFS
# ==============================================
# Applied by the app, which reads the static GTFS feed, builds the service from it and updates it.
# URL, file path or S3 URI of the static GTFS feed. In the case of S3, provide the access credentials via environment
# variables: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION.
# Examples:
# - naviqore.gtfs.static.uri=https://data.opentransportdata.swiss/dataset/timetable-2026-gtfs2020/permalink
# - naviqore.gtfs.static.uri=benchmark/input/switzerland.zip
# - naviqore.gtfs.static.uri=https://connolly.ch/zuerich-trams.zip
# - naviqore.gtfs.static.uri=s3://my-bucket-name/path/to/gtfs.zip
naviqore.gtfs.static.uri=libs/gtfs-sample/src/main/resources/org/naviqore/gtfs/schedule/sample-feed-1.zip
# Cron expression for updating the static GTFS feed: the service is built again from the feed, which is downloaded
# again from a URL or S3 and read again from a file. Public transit agencies update their static GTFS data regularly.
# Set this interval to match the agency's publish schedule, or '-' for no updates. Default is to update the schedule
# daily at 4 AM.
naviqore.gtfs.static.update-cron=0 0 4 * * *
# ==============================================
# SERVICE
# ==============================================
# Applied by the public transit service: the walks it generates between stops and from and to locations, and its
# connection queries.
# Minimum duration in seconds of the walks the service generates between the stops within the search radius (see
# 'naviqore.service.walk.search-radius'): a walk that takes less, with the access and egress time, takes this time,
# which accounts for leaving the station building, stairways, etc. A transfer of the timetable between two stops has
# precedence. A negative value, such as -1, generates no walks between stops.
naviqore.service.transfer.duration.between-stops-minimum=-1
# Time in seconds required to access or egress from a public transit trip. This time is added twice to the walks
# generated between two stops and once to the first and last mile.
naviqore.service.transfer.duration.access-egress=15
# Search radius in meters, a beeline distance: a connection from or to a location walks from or to the stops within it,
# or else the nearest stop. The walks generated between stops are within it too (see
# 'naviqore.service.transfer.duration.between-stops-minimum'), as are the stops near a stop whose stop times are
# requested with the scope NEARBY. A walk is longer than its beeline distance.
naviqore.service.walk.search-radius=500
# Type of walking calculator used to calculate walking distances. Currently only BEE_LINE_DISTANCE is supported.
naviqore.service.walk.calculator-type=BEE_LINE_DISTANCE
# Walking speed in meters per second. The default value is based on the average preferred walking speed.
# Source: https://en.wikipedia.org/wiki/Preferred_walking_speed
naviqore.service.walk.speed=1.4
# Minimum walking duration in seconds. If the walking duration, without access or egress time (see
# 'naviqore.service.transfer.duration.access-egress'), is shorter, no first or last mile walk is needed to reach the
# location. This avoids very short walks inside stations that give a false sense of accuracy.
naviqore.service.walk.duration-minimum=60
# Whether a connection query without a time window optimizes the travel time: of the connections arriving as early with
# as many transfers, it reports the one departing latest (for an arrival query: of those departing as late, the one
# arriving earliest), found by a second query in the other direction. Queries with a time window report those anyway.
# The default is true.
naviqore.service.optimize-travel-time=true
# ==============================================
# RAPTOR
# ==============================================
# Applied by the RAPTOR router, which the service configures.
# Number of service days around the date of a query that are scanned for trips. This is useful if the previous service
# day includes trips on the queried date, or if the connection is so long that it continues into the next service day.
# The default value is 3, which includes the previous, current, and next service day. A query with a time window also
# scans the days its window reaches.
naviqore.raptor.days-to-scan=3
# Default same stop transfer time in seconds: the time to change trips at a stop for which the timetable gives none. A
# same stop transfer time of the timetable has precedence over this default. If the value is set to 0, changing trips
# at such a stop takes no time.
naviqore.raptor.same-stop-transfer-duration-default=120
# Number of service days whose stop times are cached. A query reads the stop times of each service day it scans (see
# 'naviqore.raptor.days-to-scan'), and a service day is cached once for each combination of wheelchair, bike and travel
# mode settings it is queried with. Dates with the same active services share their stop times (e.g. if all Mondays in
# the schedule have the same active services, one instance serves all Mondays). The stop times of a service day hold
# the trips running on it, about 26 MB on the Swiss national feed. The service caches which services are active on
# twenty times as many dates, at most 365.
naviqore.raptor.stop-time-cache-size=30
# Cache eviction strategy of the stop times: LRU (Least Recently Used) or MRU (Most Recently Used).
naviqore.raptor.stop-time-cache-strategy=LRU
# ==============================================
# ROUTING
# ==============================================
# Applied by the app to the requests of its REST API to /routing; the service and the router have no limit.
# Longest time window of a request for connections or isolines in seconds; a request with a longer one is refused. A
# query over a time window runs a search for each departure in it and reads the stop times of every service day it
# reaches (see 'naviqore.raptor.stop-time-cache-size'), so long windows take much time and memory. The default is one
# day (86400).
naviqore.routing.time-window-duration-maximum=86400
# ==============================================
# HOME PAGE
# ==============================================
# Applied by the app.
# Enable or disable the HTML landing page at the root context path ("/"). Disable in production environments where only
# API access is required.
naviqore.home-page.enabled=true
# ==============================================
# WEB
# ==============================================
# Applied by Spring and springdoc to the REST API.
# Enable or disable the generation of OpenAPI v3 documentation in JSON/YAML format (/v3/api-docs). Recommended to be
# disabled in production.
springdoc.api-docs.enabled=true
# Enable or disable the interactive Swagger UI web interface (/swagger-ui.html). Allows developers to test endpoints in
# a browser. Recommended to be disabled in production.
springdoc.swagger-ui.enabled=true
# Enable RFC 7807 Problem Detail responses for Spring MVC exceptions.
spring.mvc.problemdetails.enabled=true
# ==============================================
# MANAGEMENT
# ==============================================
# Applied by Spring Boot.
# Management endpoints to expose over the web interface. The default is 'health', 'info' and 'metrics'.
management.endpoints.web.exposure.include=health,info,metrics
# Set the root logging level for the application, INFO is recommended.
logging.level.root=INFO
